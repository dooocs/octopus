name: Co-follow Scan (one-off)

# Temporary: runs scripts/cofollow_scan.py on pushes to this branch and commits
# the result JSON back to it. The branch is deleted after the scan.

on:
  push:
    branches: [tmp/cofollow-scan]
    paths: [scripts/cofollow_scan.py, .github/workflows/cofollow_scan.yml]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
      HANDLES: marckohlbrugge,dvassallo,csallen,robj3d3,ericsmith1302,BrettFromDJ,ajlkn,SimonHoiberg,czue,jasonleowsg,sergeynazarovx,helloitsolly,jayvraavi,alexcooldev,ikoichi,Pauline_Cx,eurofounder,pbteja1998,d__raptis,heyandras,adriaandotcom,ErnestoSOFTWARE,charliie,Shpigford,ImSh4yy,iannuttall,linuz90,Erwin_AI,nico_jeannen,andilosing,tonnoz,_lhermann,sobedominik,JamesIvings,seraleev,anton_maker,gefei55,idoubicc,Tz_2022,luoleiorg,ezshine,vikingmute,tualatrix,ripperhe,decohack,lxfater,jesselaunz,Barret_China,nishuang,wsygc,hongming731,bozhou_ai,KevinTu_,shao__meng,CoderMagicX,frxiaobei,dotey,ilovek8s,yihong0618,Jiaxi_Cui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - run: python -m scripts.cofollow_scan --out verify_sample.json --handles "$HANDLES"
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add verify_sample.json
          git commit -m "cofollow scan result"
          git push
