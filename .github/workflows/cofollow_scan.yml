name: Co-follow Scan (one-off)

# Temporary: runs scripts/cofollow_scan.py on pushes to this branch and commits
# the result JSON back to it. The branch is deleted after the scan.

on:
  push:
    branches: [tmp/cofollow-scan]
    paths: [scripts/cofollow_scan.py, .github/workflows/cofollow_scan.yml]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - run: python -m scripts.cofollow_scan --out cofollow_result.json
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add cofollow_result.json
          git commit -m "cofollow scan result"
          git push
