name: Feed Media Backfill

# One-off maintenance (scripts/backfill_feed_media.py): archive the videos of
# recent feed posts to OSS, strip X CDN URLs from every feed row in raw_items,
# then re-run feed_digest and ask ahaIndex2 to publish /feed. Shares the
# feed-pipeline concurrency group, so it never overlaps an hourly collect.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Look up videos of posts published in the last N days"
        required: false
        default: "3"
      dry_run:
        description: "Report only, write nothing"
        required: false
        type: boolean
        default: true

concurrency:
  group: feed-pipeline
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      OCTOPUS_RDS_HOST: ${{ secrets.OCTOPUS_RDS_HOST }}
      OCTOPUS_RDS_PORT: ${{ secrets.OCTOPUS_RDS_PORT }}
      OCTOPUS_RDS_USER: ${{ secrets.OCTOPUS_RDS_USER }}
      OCTOPUS_RDS_PASSWORD: ${{ secrets.OCTOPUS_RDS_PASSWORD }}
      OCTOPUS_RDS_DATABASE: ${{ secrets.OCTOPUS_RDS_DATABASE }}
      OCTOPUS_RDS_CHARSET: ${{ secrets.OCTOPUS_RDS_CHARSET }}
      OCTOPUS_RDS_CONNECT_TIMEOUT: ${{ secrets.OCTOPUS_RDS_CONNECT_TIMEOUT }}
      OCTOPUS_RDS_SSL_CA: ${{ secrets.OCTOPUS_RDS_SSL_CA }}

      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install .

      - name: Backfill
        run: |
          args=(--days "${{ inputs.days }}" --inspect)
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then args+=(--dry-run); fi
          set -o pipefail
          python -m scripts.backfill_feed_media "${args[@]}" | tee backfill.log
          # The results as annotations, readable through the API without the log.
          grep -E '^(feed rows|rows of|looked up|videos:|would update|updated|sample media)' backfill.log | head -8 | sed 's/^/::notice::/' || true

      - name: Re-run feed_digest
        if: ${{ !inputs.dry_run }}
        run: python -m scripts.run_pipeline feed_digest

      - name: Tell ahaIndex2 to publish /feed
        if: ${{ !inputs.dry_run }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [[ -z "$GH_PAT" ]]; then echo "::warning::GH_PAT is not set"; exit 0; fi
          curl -s -o /dev/null -w "%{http_code}\n" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_PAT" \
            https://api.github.com/repos/dooocs/ahaIndex2/dispatches \
            -d '{"event_type":"feed-updated"}'
