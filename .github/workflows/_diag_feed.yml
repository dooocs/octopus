name: TMP Feed Diagnose
on:
  push:
    branches: [claude/tmp-feed-diagnose]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          note() { printf '::notice title=%s::%s\n' "$1" "$(printf '%s' "$2" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; }
          S=https://www.amazingindex.com
          curl -s "$S/feed" -o feed.html
          note "live /feed" "title: $(grep -o '<title>[^<]*' feed.html | head -1 | sed 's/<title>//')
          authors: $(grep -o '<article class="feed-author" id="[^"]*"' feed.html | sed 's/.*id="//;s/"//' | tr '\n' ' ')
          posts: $(grep -o 'class="feed-post"' feed.html | wc -l)  zh: $(grep -o 'class="feed-text feed-zh"' feed.html | wc -l)  media blocks: $(grep -o '<div class="feed-media' feed.html | wc -l)
          latest: $(grep -o '最新 <time[^>]*>[^<]*' feed.html | sed 's/<[^>]*>//g' | head -1)
          nav: $(grep -o '<a href="/feed" class="nav-tab[^"]*"' feed.html | head -1)  t.co left: $(grep -o 't\.co/' feed.html | wc -l)"
          imgs=$(grep -o 'src="https://www.amazingindex.com/media/x/[^"]*"' feed.html | sed 's/src="//;s/"//' | sort -u)
          ok=0; bad=""; for i in $imgs; do c=$(curl -s -o /dev/null -w '%{http_code}' "$i"); [[ $c == 200 ]] && ok=$((ok+1)) || bad="$bad $c:$i"; done
          note "images on /feed" "ok=$ok of $(echo "$imgs" | grep -c .) $bad"
          curl -s "$S/" -o home.html; note "homepage nav" "$(grep -o 'class="nav-tabs">.\{0,400\}' home.html | grep -o '>[^<>]\+</a>' | tr '\n' ' ')"
          css=$(grep -o 'href="/_astro/[^"]*\.css"' feed.html | sed 's/href="//;s/"//'); for c in $css; do note "css $c" "$(curl -s -o /dev/null -w '%{http_code} %{size_download}B' "$S$c")"; done
